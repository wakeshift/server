name: CI

# Every pull request and every push to main: the Go tests against
# Postgres, the console's type check and build, the release gate (the
# quickstart, end to end, in Docker), the harness runner's tests, a secret
# scan and a lint of these workflows.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [coretest, rest]
    services:
      postgres:
        image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Some tests run the plugins' JavaScript and the Hermes plugin's
      # Python (they skip without them).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Format
        if: matrix.shard == 'rest'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        if: matrix.shard == 'rest'
        run: go vet ./...
      - name: Build
        if: matrix.shard == 'rest'
        run: go build ./cmd/wakeshift ./cmd/appkey ./cmd/wakeshift-connector ./cmd/wakeshift-agent-plugins
      # The tests make a database each, as the superuser here.
      - name: Test
        env:
          WAKESHIFT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$SHARD" = coretest ]; then
            pkgs=./internal/coretest/...
          else
            pkgs=$(go list ./... | grep -v '/internal/coretest')
          fi
          # shellcheck disable=SC2086 # one package per word
          go test -race -timeout 30m $pkgs

  web:
    name: Console
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Type-check and build
        working-directory: web
        run: npm ci --ignore-scripts --no-fund --no-audit && npm run lint && npm run build

  # The quickstart as the README gives it: docker compose builds the image
  # and starts Postgres 17 and the server, which migrates the fresh
  # database; an app registered through WAKESHIFT_APPS has an MCP Events
  # client subscribe on push (events/stream) and gets an emitted event and
  # a signed webhook (internal/releasegate).
  gate:
    name: Release gate (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Gate
        run: go run ./internal/releasegate

  # The harness runner (bench/, Node 26 or newer): its unit tests and a dry
  # run on its fake harness (no agent, account or key). Its exit code 3, the
  # check that a run would touch real agent configs, fails the job too.
  bench:
    name: Harness runner (unit tests, dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: tmux
        run: command -v tmux || (sudo apt-get update && sudo apt-get install -y tmux)
      - name: Unit tests
        run: make bench-test
      - name: Dry run (fake harness)
        run: make bench-dry-run

  # Secrets in the history and the tree; every known false positive is
  # listed, with why, in .gitleaks.toml.
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --exit-code 1 .

  # These workflows (actionlint, with shellcheck on their run steps), pinned
  # by version: Go's checksum database verifies the module.
  actionlint:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
