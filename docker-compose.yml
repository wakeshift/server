# Postgres and the Wakeshift server, on this machine only:
#
#   docker compose run --build --rm --no-deps --entrypoint /appkey server -app example
#   export WAKESHIFT_APPS='<the JSON it printed after WAKESHIFT_APPS=>'
#   export WAKESHIFT_SECRET_KEY=$(openssl rand -base64 48)
#   docker compose up --build
#
# The server is at http://localhost:8370 and migrates the database at
# startup. WAKESHIFT_APPS registers your apps by their public keys; your
# app's SDK takes the WAKESHIFT_KEY line, with WAKESHIFT_CORE set to
# http://localhost:8370. (With Go: go run ./cmd/appkey -app example.)
# `go run ./internal/releasegate` (make gate) does all of this with a fresh
# key and checks an event reaches an MCP Events client on push.
#
# Every port is published on 127.0.0.1 only. Inside the container the
# server listens on all of its interfaces (WAKESHIFT_ADDR, :8370), which
# Docker's port publishing needs, and a browser's connection arrives from
# Docker's network, not loopback. So this setup uses neither the console's
# email-only development sign-in (WAKESHIFT_DEV_SIGN_IN) nor the published
# development secret key, which the server allows only on loopback. To use
# the console with that sign-in, run the server on this machine instead:
# `make run` starts only Postgres here and the server on 127.0.0.1:8370.
# Or set up a GitHub or Google OAuth app (the variables below).
services:
  postgres:
    image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    environment:
      POSTGRES_USER: postgres
      # This local database's superuser, used only by the init script below.
      POSTGRES_PASSWORD: postgres
    # For `make run` and `make test`, which run on this machine. If port
    # 5439 is taken, set WAKESHIFT_DB_PORT to another.
    ports:
      - "127.0.0.1:${WAKESHIFT_DB_PORT:-5439}:5432"
    volumes:
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during its first start, Postgres runs the init script on a
      # server that listens only on its socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d wakeshift"]
      interval: 2s
      timeout: 5s
      retries: 30

  server:
    build: .
    # Or the published image instead of building: image: ghcr.io/wakeshift/server:<version>
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8370:8370"
    environment:
      # The two roles from deploy/postgres-init.sql, neither a superuser, so
      # row-level security applies: the owner migrates at startup, then the
      # server runs as a role that only reads and writes. (A database
      # volume made before deploy/postgres-init.sql had the second role
      # needs it created by hand, as that file does.)
      DATABASE_URL: postgres://wakeshift_server:wakeshift_server@postgres:5432/wakeshift?sslmode=disable
      WAKESHIFT_MIGRATE_DATABASE_URL: postgres://wakeshift:wakeshift@postgres:5432/wakeshift?sslmode=disable
      WAKESHIFT_ADDR: ":8370"
      WAKESHIFT_PUBLIC_URL: http://localhost:8370
      # Required: at least 32 random bytes (openssl rand -base64 48). Unset,
      # the server exits saying so.
      WAKESHIFT_SECRET_KEY: ${WAKESHIFT_SECRET_KEY:-}
      WAKESHIFT_APPS: ${WAKESHIFT_APPS:-[]}
      # MCP Events push (events/stream). Unset, it's on only when
      # WAKESHIFT_PUBLIC_URL is a localhost URL; on here, so it stays on if
      # you change that URL.
      WAKESHIFT_MCP_EVENTS_PUSH: "1"
      WAKESHIFT_LOG_FORMAT: text
      # Sign-in for the console (optional): an OAuth app's credentials,
      # whose callback is http://localhost:8370/auth/github/callback (or
      # /auth/google/callback).
      WAKESHIFT_GITHUB_CLIENT_ID: ${WAKESHIFT_GITHUB_CLIENT_ID:-}
      WAKESHIFT_GITHUB_CLIENT_SECRET: ${WAKESHIFT_GITHUB_CLIENT_SECRET:-}
      WAKESHIFT_GOOGLE_CLIENT_ID: ${WAKESHIFT_GOOGLE_CLIENT_ID:-}
      WAKESHIFT_GOOGLE_CLIENT_SECRET: ${WAKESHIFT_GOOGLE_CLIENT_SECRET:-}
      # Who may create an account: comma-separated emails and @domains
      # (Google Workspace domains). Sign-up is closed to everyone else, so
      # put yourself here before you first sign in. WAKESHIFT_OPEN_SIGNUPS=1
      # opens it to anyone, up to a cap (docs/self-hosting.md, "Who can
      # sign up").
      WAKESHIFT_ALLOWED_SIGNUPS: ${WAKESHIFT_ALLOWED_SIGNUPS:-}
      WAKESHIFT_OPEN_SIGNUPS: ${WAKESHIFT_OPEN_SIGNUPS:-}
      # Installs for Codex and the other agents that need one (optional).
      # The image carries no connector, so out of the box their install
      # offers say it isn't available. Build it into bin/connector/
      # (docs/self-hosting.md, "The connector and installs"), uncomment the
      # volume below, and start with
      #   WAKESHIFT_CONNECTOR_DIR=/connector docker compose up --build
      # Or set WAKESHIFT_INSTALLER_URL to installers built for this server.
      WAKESHIFT_CONNECTOR_DIR: ${WAKESHIFT_CONNECTOR_DIR:-}
      WAKESHIFT_INSTALLER_URL: ${WAKESHIFT_INSTALLER_URL:-}
    # volumes:
    #   - ./bin/connector:/connector:ro

  # Webhooks (apps/try), only with the profile webhooks: a page that gives
  # you a webhook URL and an MCP URL for your agent; ask the agent to watch,
  # and each POST to the webhook URL wakes it. Set up once, then start:
  #
  #   sh deploy/webhooks-env.sh      # writes .env: keys and secrets
  #   docker compose --profile webhooks up --build
  #
  # Then open http://localhost:8380. Plain `docker compose up` leaves it out.
  webhooks:
    profiles: [webhooks]
    build:
      context: .
      target: webhooks
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_started
    ports:
      - "127.0.0.1:8380:8380"
    environment:
      # The app's own database and its two roles (deploy/postgres-init.sql):
      # the owner migrates at startup, then the app runs as a role that only
      # reads and writes.
      TRY_DATABASE_URL: postgres://webhooks_app:webhooks_app@postgres:5432/webhooks?sslmode=disable
      TRY_MIGRATE_DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks?sslmode=disable
      # The server's public URL (its WAKESHIFT_PUBLIC_URL), which the app's
      # signed requests are addressed to; always set here, since unset the
      # app talks to Wakeshift's hosted service. Inside compose the server is
      # at http://server:8370, so requests go there (TRY_CORE_ADDR).
      WAKESHIFT_CORE: http://localhost:8370
      TRY_CORE_ADDR: http://server:8370
      # The app's key, registered with the server in WAKESHIFT_APPS, and the
      # secret that signs its links: deploy/webhooks-env.sh writes both to
      # .env. Never a fixed value: unset, the app exits saying so. (Not
      # ${…:?}, which docker compose checks even without the profile, so
      # plain `docker compose up` would fail too.)
      WAKESHIFT_KEY: ${WEBHOOKS_KEY:-}
      TRY_SECRET: ${WEBHOOKS_SECRET:-}
      PUBLIC_URL: http://localhost:8380
      # Inside the container it listens on all of its interfaces, which
      # Docker's port publishing needs; the port is published on 127.0.0.1
      # only (above), so posts reach it straight from this machine, through
      # no proxy.
      PORT: "8380"
      TRY_PROXY_HOPS: "0"

volumes:
  pgdata:
