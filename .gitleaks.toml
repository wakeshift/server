# gitleaks' configuration (CI: .github/workflows/ci.yml): its default rules,
# and every known false positive in this repository, one file at a time,
# with why it's harmless. Each entry names only the rules that matched it,
# so a different kind of secret in the same file is still reported. A new
# hit is a real finding until someone reads it and adds it here with a
# reason; never allowlist a directory.

[extend]
useDefault = true

# The SDKs' shared fixtures (the golden files every SDK's tests read).

[[allowlists]]
description = "App keys made from the fixture seeds in the same file (all zeros, 0x00..0x1f, a 0xdeadbeef pattern, all 0xff), and malformed keys the parser must refuse"
targetRules = ["generic-api-key"]
paths = ['''(^|/)sdk/typescript/test/app-keys\.json$''']

[[allowlists]]
description = "WAKESHIFT_KEY values in the disabled-client fixture: three of app-keys.json's fixture keys"
targetRules = ["generic-api-key"]
paths = ['''(^|/)sdk/typescript/test/disabled-client\.json$''']

[[allowlists]]
description = "One fixture webhook signing secret (whsec_), used throughout the MCP Events wire fixture with https://agent.example"
targetRules = ["generic-api-key"]
paths = ['''(^|/)sdk/typescript/test/mcp-events-wire\.json$''']

[[allowlists]]
description = "Inputs the secret scrubber must redact: a made-up signing secret and JWTs signed by no real issuer"
targetRules = ["generic-api-key", "jwt"]
paths = ['''(^|/)sdk/typescript/test/secret-pattern\.json$''']

# Go tests: canaries a test checks never reach a log, and test vectors.

[[allowlists]]
description = "A made-up webhook secret the test signs with"
targetRules = ["generic-api-key"]
paths = ['''(^|/)internal/agenthooks/agenthooks_test\.go$''']

[[allowlists]]
description = "A made-up bot ID and setup code for the bot-key format's test"
targetRules = ["generic-api-key"]
paths = ['''(^|/)internal/botkeys/commands_test\.go$''']

[[allowlists]]
description = "Canary watch-URL secrets the test checks never reach a log"
targetRules = ["generic-api-key"]
paths = ['''(^|/)internal/coretest/capy_webhook_test\.go$''']

[[allowlists]]
description = "A canary the test checks telemetry never exports"
targetRules = ["generic-api-key"]
paths = ['''(^|/)internal/coretest/telemetry_capy_test\.go$''']

[[allowlists]]
description = "A Standard Webhooks test vector: a published example secret and the signature it gives"
targetRules = ["generic-api-key"]
paths = ['''(^|/)internal/mcpevents/verify_test\.go$''']

[[allowlists]]
description = "An Ed25519 public key (no private half), for the OAuth tests"
targetRules = ["generic-api-key"]
paths = ['''(^|/)internal/oauth/oauth_test\.go$''']

[[allowlists]]
description = "Canary tokens the log scrubber must redact"
targetRules = ["generic-api-key"]
paths = ['''(^|/)internal/telemetry/(logscrub|scrub)_test\.go$''']

# The Hermes plugin's tests (Python).

[[allowlists]]
description = "Made-up session keys a fake core hands the plugin in its tests"
targetRules = ["generic-api-key"]
paths = ['''(^|/)plugins/hermes/tests/test_plugin\.py$''']

